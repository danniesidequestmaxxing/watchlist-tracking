[project]
name = "trading-bot"
version = "0.1.0"
description = "Personal multi-asset Telegram trading bot tracking crypto, US equities, and Bursa Malaysia."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "APScheduler>=3.10",
    "aiosqlite>=0.20",
    "pandas>=2.2",
    "ccxt>=4.4",
    "yfinance>=0.2.40",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["telegram"]
